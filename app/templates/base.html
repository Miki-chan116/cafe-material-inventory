<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>喫茶店 材料在庫</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;line-height:1.5;color:#26221e}
    nav{display:flex;gap:1rem;align-items:center;flex-wrap:wrap} a{color:#754421} table{border-collapse:collapse;width:100%}
    th,td{border-bottom:1px solid #ddd;padding:.6rem;text-align:left} label{display:block;margin:.8rem 0}
    input,select,button{font:inherit;padding:.4rem} input{max-width:100%} .warning{color:#9b271c;font-weight:bold}
    .flash{background:#fff3db;padding:.6rem} button{cursor:pointer}
  </style>
</head>
<body>
<nav><a href="{{ url_for('index') }}">材料一覧</a>
{% if current_user %}
{% if current_user.role == 'admin' %}<a href="{{ url_for('ingredient_new') }}">材料登録</a><a href="{{ url_for('user_new') }}">ユーザー登録</a>{% endif %}
<span>{{ current_user.username }} ({{ current_user.role }})</span>
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>ログアウト</button></form>
{% endif %}</nav>
{% for message in get_flashed_messages() %}<p class="flash" role="alert">{{ message }}</p>{% endfor %}
{% block content %}{% endblock %}
</body></html>
