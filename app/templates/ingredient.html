{% extends 'base.html' %}{% block content %}
<h1>{% if ingredient %}材料編集{% else %}材料登録{% endif %}</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>材料名 <input name="name" maxlength="120" value="{{ ingredient.name if ingredient else '' }}" required></label>
{% if ingredient %}<p>単位: {{ ingredient.unit }}（登録後は変更不可）</p>
{% else %}<label>単位 <select name="unit"><option>g</option><option>ml</option><option>個</option></select></label>{% endif %}
<label>最低在庫数 <input name="minimum" type="number" min="0" max="999999999" step="0.001" value="{{ ingredient.minimum_milli|quantity if ingredient else '0' }}" required></label>
<button>保存</button></form>
{% endblock %}
